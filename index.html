<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title id="pageTitle">Radio Sound TM - Refining music!</title>

    <link rel="icon" href="logo.png" type="image/png" />

    <meta
      id="metaDesc"
      name="description"
      content="Radio Sound TM este frecvența ta de negăsit în altă parte. Descoperă muzică electronică underground de calitate superioară: Drum and Bass, Jungle, Breakbeat și House, transmise 24/7 direct din Timișoara. Conectează-te și simte ritmul!"
    />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="theme-color" content="#0d0e11" />

    <link
      rel="preconnect"
      href="https://radio.radiosoundtm.online"
      crossorigin
    />
    <link rel="dns-prefetch" href="https://radio.radiosoundtm.online" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg-color: #0d0e11;
        --card-bg: #16181d;
        --accent-green: #56cb4c;
        --accent-green-hover: #48b53f;
        --accent-green-glow: rgba(86, 203, 76, 0.15);
        --accent-green-glow-intense: rgba(86, 203, 76, 0.35);
        --accent-loading: #ffaa00;
        --accent-red: #e63900;
        --text-main: #ffffff;
        --text-muted: #a0a6b2;
        --border-color: #272a33;
        --fb-blue: #1877f2;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      /* Corecție critică pentru consistență cross-browser pe mobil */
      html {
        background-color: var(--bg-color);
        color: var(--text-main);
        font-family: "Inter", sans-serif;
        width: 100%;
        height: 100%;
      }

      body {
        background-color: var(--bg-color);
        color: var(--text-main);
        font-family: "Inter", sans-serif;
        width: 100%;
        min-height: 100%;
        /* Folosim o abordare sigură de flexbox pe body cu scroll nativ fluid pe toate motoarele */
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: calc(10px + env(safe-area-inset-top)) 12px
          calc(20px + env(safe-area-inset-bottom)) 12px;
        user-select: none;
        -webkit-user-select: none;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        background-image:
          radial-gradient(
            circle at 50% 15%,
            rgba(86, 203, 76, 0.05) 0%,
            transparent 45%
          ),
          radial-gradient(
            circle at 50% 85%,
            rgba(13, 14, 17, 0.9) 0%,
            transparent 100%
          );
      }

      .app-wrapper {
        width: 100%;
        max-width: 480px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }

      .lang-switcher {
        position: absolute;
        top: 10px;
        right: 10px;
        z-index: 15;
        display: flex;
        justify-content: flex-end;
        gap: 6px;
      }

      .lang-btn {
        background: rgba(22, 24, 29, 0.85);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        border: 1px solid var(--border-color);
        color: var(--text-muted);
        padding: 4px 10px;
        border-radius: 8px;
        font-size: 0.7rem;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.15s ease;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
      }

      .lang-btn.active {
        background: rgba(86, 203, 76, 0.15);
        color: var(--accent-green);
        border-color: var(--accent-green);
      }

      header,
      main {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      header {
        margin: 4px 0 8px 0;
        width: 100%;
      }

      .logo-container {
        position: relative;
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .logo-container img {
        width: 100%;
        max-width: 100%;
        height: auto;
        display: block;
        filter: drop-shadow(0 0 12px var(--accent-green-glow));
      }

      .logo-play {
        position: absolute;
        top: 43%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 10;
        background: linear-gradient(145deg, #5eff51, #4cb043);
        color: #000000;
        border: none;
        width: 73px;
        height: 73px;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow:
          0 6px 16px var(--accent-green-glow-intense),
          0 4px 12px rgba(0, 0, 0, 0.5),
          inset 0 2px 4px rgba(255, 255, 255, 0.4),
          inset 0 -2px 4px rgba(0, 0, 0, 0.3);
        transition:
          transform 0.2s cubic-bezier(0.4, 0, 0.2, 1),
          background 0.2s ease,
          box-shadow 0.2s ease;
        will-change: transform, box-shadow;
      }

      .logo-play svg {
        width: 32px;
        height: 32px;
        fill: #000000;
        display: block;
      }

      .logo-play.loading {
        background: linear-gradient(145deg, #ffc033, #ff9900);
        box-shadow:
          0 6px 16px rgba(255, 170, 0, 0.4),
          0 4px 12px rgba(0, 0, 0, 0.5),
          inset 0 2px 4px rgba(255, 255, 255, 0.4),
          inset 0 -2px 4px rgba(0, 0, 0, 0.3);
        animation: pulseLoading 1s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        pointer-events: none;
      }

      @keyframes pulseLoading {
        0%,
        100% {
          transform: translate(-50%, -50%) scale(1);
        }
        50% {
          transform: translate(-50%, -50%) scale(0.92);
        }
      }

      .logo-play:active:not(.loading),
      .logo-play.active-press:not(.loading) {
        transform: translate(-50%, -50%) scale(0.92);
        background: linear-gradient(145deg, #3fa137, #4cb043);
        box-shadow:
          0 2px 6px var(--accent-green-glow-intense),
          0 2px 4px rgba(0, 0, 0, 0.6),
          inset 0 4px 6px rgba(0, 0, 0, 0.4);
      }

      main {
        gap: 10px;
        flex: 1;
      }

      .player-card {
        width: 100%;
        background-color: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        padding: 14px 12px;
        text-align: center;
        position: relative;
        box-shadow:
          0 8px 24px rgba(0, 0, 0, 0.5),
          0 0 10px var(--accent-green-glow);
      }

      .player-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 3px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--accent-green),
          transparent
        );
      }

      .status-vu-container {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-bottom: 12px;
        width: 100%;
      }

      .vu-meter-vintage {
        position: relative;
        width: 72px;
        height: 42px;
        background: linear-gradient(180deg, #332d25 0%, #1a1713 100%);
        border: 1px solid #5a4f3d;
        border-radius: 6px;
        padding: 2px;
        box-shadow:
          inset 0 1px 3px rgba(255, 255, 255, 0.15),
          inset 0 -2px 6px rgba(0, 0, 0, 0.9),
          0 2px 6px rgba(0, 0, 0, 0.6);
        overflow: hidden;
      }

      .vu-meter-vintage.powered {
        box-shadow:
          inset 0 1px 3px rgba(255, 255, 255, 0.2),
          inset 0 -2px 6px rgba(0, 0, 0, 0.9),
          0 0 10px rgba(230, 180, 80, 0.25);
      }

      .vu-dial {
        width: 100%;
        height: 100%;
        background: radial-gradient(
          circle at 50% 120%,
          #fff4d0 0%,
          #f3e3b3 50%,
          #d9c591 100%
        );
        border-radius: 4px;
        position: relative;
        overflow: hidden;
        border: 1px solid #7c6d54;
      }

      .vu-svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: rgba(160, 166, 178, 0.1);
        color: var(--text-muted);
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 0.65rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
        border: 1px solid rgba(160, 166, 178, 0.25);
        transition:
          color 0.3s ease,
          border-color 0.3s ease,
          background 0.3s ease;
      }

      .status-badge.connected {
        background: rgba(86, 203, 76, 0.1);
        color: var(--accent-green);
        border-color: rgba(86, 203, 76, 0.25);
      }

      .status-badge.buffering {
        color: var(--accent-loading);
        background: rgba(255, 170, 0, 0.1);
        border-color: rgba(255, 170, 0, 0.25);
      }

      .status-dot {
        width: 7px;
        height: 7px;
        background-color: var(--text-muted);
        border-radius: 50%;
        box-shadow: 0 0 4px rgba(160, 166, 178, 0.5);
      }

      .status-badge.connected .status-dot {
        background-color: var(--accent-green);
        box-shadow: 0 0 6px var(--accent-green);
        animation: pulseDot 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      @keyframes pulseDot {
        0%,
        100% {
          opacity: 1;
          box-shadow:
            0 0 8px var(--accent-green),
            0 0 12px var(--accent-green);
          transform: scale(1);
        }
        50% {
          opacity: 0.35;
          box-shadow: 0 0 2px var(--accent-green);
          transform: scale(0.85);
        }
      }

      .track-container {
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: center;
        gap: 12px;
      }

      .turntable-container {
        position: relative;
        width: 150px;
        height: 150px;
        min-width: 150px;
        background: radial-gradient(
          circle at 50% 30%,
          #222731 0%,
          #14171d 70%,
          #0e1014 100%
        );
        border-radius: 12px;
        border: 1.5px solid #2e3543;
        box-shadow:
          inset 0 1px 1px rgba(255, 255, 255, 0.15),
          inset 0 -2px 6px rgba(0, 0, 0, 0.8),
          0 0 16px var(--accent-green-glow),
          0 8px 18px rgba(0, 0, 0, 0.6);
        overflow: hidden;
      }

      .technics-branding {
        position: absolute;
        top: 6px;
        left: 8px;
        font-size: 0.32rem;
        font-weight: 800;
        color: #d8dde6;
        letter-spacing: 0.3px;
        text-transform: uppercase;
        opacity: 0.9;
        pointer-events: none;
        z-index: 4;
      }

      .technics-branding span {
        color: var(--accent-green);
        font-size: 0.26rem;
        display: block;
        font-weight: 700;
        margin-top: -1px;
      }

      .technics-start-btn {
        position: absolute;
        bottom: 6px;
        left: 8px;
        width: 24px;
        height: 14px;
        background: linear-gradient(180deg, #3d4350, #1c2027);
        border: 1px solid #4f5768;
        border-radius: 3px;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 4;
        pointer-events: none;
      }

      .technics-start-btn::after {
        content: "START·STOP";
        font-size: 0.18rem;
        font-weight: 800;
        color: var(--accent-green);
      }

      .technics-speed-btns {
        position: absolute;
        bottom: 23px;
        left: 8px;
        display: flex;
        gap: 3px;
        z-index: 4;
      }

      .speed-btn-dot {
        width: 6px;
        height: 6px;
        background: linear-gradient(180deg, #444, #111);
        border: 0.5px solid #666;
        border-radius: 1px;
      }

      .speed-btn-dot.active {
        background: var(--accent-green);
        box-shadow: 0 0 4px var(--accent-green);
      }

      .technics-strobe-tower {
        position: absolute;
        bottom: 35px;
        left: 8px;
        width: 9px;
        height: 9px;
        background: radial-gradient(circle, #555 30%, #111 90%);
        border: 1px solid #666;
        border-radius: 50%;
        z-index: 4;
      }

      .technics-strobe-light {
        position: absolute;
        top: 2px;
        left: 2px;
        width: 3px;
        height: 3px;
        background-color: #333;
        border-radius: 50%;
        transition:
          background-color 0.3s ease,
          box-shadow 0.3s ease;
      }

      .turntable-container.playing .technics-strobe-light {
        background-color: var(--accent-green);
        box-shadow: 0 0 8px var(--accent-green);
      }

      .technics-pitch-container {
        position: absolute;
        top: 32px;
        right: 6px;
        width: 9px;
        height: 85px;
        background: #0f1115;
        border: 1px solid #282d38;
        border-radius: 3px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 4;
      }

      .pitch-track {
        width: 2px;
        height: 70px;
        background: #252a35;
        position: relative;
      }

      .pitch-fader-knob {
        position: absolute;
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 7px;
        height: 10px;
        background: linear-gradient(180deg, #4f5666, #1a1d24);
        border: 0.5px solid #788399;
        border-radius: 1px;
      }

      .pitch-fader-knob::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 1px;
        right: 1px;
        height: 1.5px;
        background: var(--accent-green);
        transform: translateY(-50%);
      }

      .platter-rim {
        position: absolute;
        top: 17px;
        left: 10px;
        width: 116px;
        height: 116px;
        border-radius: 50%;
        background: repeating-conic-gradient(
          #8a94a6 0deg 1.5deg,
          #11151c 1.5deg 3deg
        );
        border: 1px solid #485263;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 2;
      }

      .platter-inner-ring {
        width: 108px;
        height: 108px;
        border-radius: 50%;
        background: radial-gradient(circle, #1a1d24 0%, #0e1014 100%);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .vinyl-disc {
        position: relative;
        width: 102px;
        height: 102px;
        border-radius: 50%;
        background: radial-gradient(
          circle at center,
          #080808 0%,
          #0d0d0d 50%,
          #080808 100%
        );
        display: flex;
        align-items: center;
        justify-content: center;
        will-change: transform;
      }

      .vinyl-label {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid #0d0d0d;
      }

      .vinyl-disc::after {
        content: "";
        position: absolute;
        width: 5px;
        height: 5px;
        background-color: var(--accent-green);
        border-radius: 50%;
        border: 1px solid #111;
        z-index: 3;
      }

      .tonearm {
        position: absolute;
        top: 8px;
        right: 12px;
        width: 42px;
        height: 75px;
        pointer-events: none;
        z-index: 5;
        transform-origin: 30px 10px;
        transform: rotate(-32deg);
        will-change: transform;
      }

      .tonearm-base {
        position: absolute;
        top: 4px;
        right: 4px;
        width: 16px;
        height: 16px;
        background: radial-gradient(circle, #4e5666 0%, #181b22 100%);
        border-radius: 50%;
        border: 1px solid #636e82;
      }

      .tonearm-counterweight {
        position: absolute;
        top: -4px;
        right: 4px;
        width: 9px;
        height: 6px;
        background: linear-gradient(90deg, #222, #777, #222);
        border-radius: 2px;
      }

      .tonearm-stick {
        position: absolute;
        top: 10px;
        right: 9px;
        width: 16px;
        height: 50px;
        border-right: 2px solid #d1d6e0;
        border-bottom: 2px solid #d1d6e0;
        border-bottom-right-radius: 16px;
      }

      .tonearm-head {
        position: absolute;
        bottom: 2px;
        left: -3px;
        width: 8px;
        height: 13px;
        background: linear-gradient(135deg, #181b20, #3a4250);
        border-radius: 2px 2px 4px 4px;
        border: 0.5px solid #6a768c;
        transform: rotate(22deg);
      }

      .turntable-container.playing .vinyl-disc {
        animation: spinVinyl 4.5s linear infinite;
        -webkit-animation: spinVinyl 4.5s linear infinite;
      }

      @keyframes spinVinyl {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
      @-webkit-keyframes spinVinyl {
        from {
          -webkit-transform: rotate(0deg);
        }
        to {
          -webkit-transform: rotate(360deg);
        }
      }

      .track-info {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
        gap: 6px;
        text-align: left;
      }

      .citrus-widget-box {
        font-size: 0.73rem;
        line-height: 1.4;
        color: var(--text-main);
        width: 100%;
        word-break: break-word;
      }

      .oscilloscope-panel {
        position: relative;
        width: 100%;
        height: 48px;
        background: linear-gradient(180deg, #1b221c 0%, #0d120e 100%);
        border: 1px solid #324a35;
        border-radius: 8px;
        padding: 3px;
        margin-top: 4px;
      }

      .crt-screen {
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at center, #142918 0%, #07120a 70%);
        border-radius: 5px;
        position: relative;
        overflow: hidden;
        border: 1px solid #1e3822;
      }

      .crt-screen canvas {
        width: 100%;
        height: 100%;
        display: block;
      }

      .about-card {
        width: 100%;
        background-color: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        padding: 12px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }

      .about-card h2 {
        color: var(--accent-green);
        font-size: 0.88rem;
        font-weight: 800;
        text-transform: uppercase;
      }

      .about-card p {
        color: var(--text-muted);
        font-size: 0.78rem;
      }

      .download-buttons {
        display: flex;
        gap: 10px;
        width: 100%;
        margin-top: 4px;
      }

      .download-btn {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background-color: #1f2229;
        color: var(--text-main);
        text-decoration: none;
        padding: 10px 12px;
        border-radius: 10px;
        font-size: 0.78rem;
        font-weight: 600;
        border: 1px solid var(--border-color);
      }

      .download-btn svg {
        width: 18px;
        height: 18px;
        fill: var(--accent-green);
        flex-shrink: 0;
      }

      .facebook-btn {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background-color: var(--fb-blue);
        color: #ffffff;
        text-decoration: none;
        padding: 10px 12px;
        border-radius: 10px;
        font-size: 0.78rem;
        font-weight: 600;
        margin-top: 6px;
        border: none;
      }

      .facebook-btn svg {
        width: 18px;
        height: 18px;
        fill: #ffffff;
        flex-shrink: 0;
      }

      .expand-header {
        cursor: pointer;
        width: 100%;
        display: flex;
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
        gap: 6px;
      }

      .expand-arrow {
        width: 22px;
        height: 22px;
        fill: var(--accent-green);
        transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .expand-card.open .expand-arrow {
        transform: rotate(180deg);
      }

      .expand-content {
        display: grid;
        grid-template-rows: 0fr;
        transition:
          grid-template-rows 0.35s ease,
          margin-top 0.35s ease;
        margin-top: 0;
        width: 100%;
      }

      .expand-card.open .expand-content {
        grid-template-rows: 1fr;
        margin-top: 10px;
      }

      .expand-inner {
        overflow: hidden;
        min-height: 0;
      }

      .partner-container {
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-top: 14px;
        margin-bottom: 6px;
      }

      footer {
        width: 100%;
        text-align: center;
        padding: 10px 0;
        font-size: 0.75rem;
        color: var(--text-muted);
      }

      footer a {
        color: var(--accent-green);
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <!-- Conținutul rămâne neschimbat, scripturile la fel -->
  </body>
</html>
